<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تمرین تنفس - معبد احساسات</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap');

  :root {
    --bg-color: #e9eceb;
    --primary-color: #394340;
    --accent-color: #687572;
    --brand-teal: #7CBFA6;
    --card-bg: rgba(250, 251, 249, 0.75);
    --card-border: rgba(255, 255, 255, 0.85);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #f4f6f5 0%, #e1e6e4 100%);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    color: var(--primary-color);
    overflow-x: hidden;
    user-select: none;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: min(100%, 480px);
    min-height: 100vh;
    padding: 24px 20px;
    position: relative;
  }

  /* بخش هدر به همراه لوگوی معبد احساسات */
  .header {
    text-align: center;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 10px;
  }

  .header-logo-svg {
    width: 65px;
    height: auto;
    filter: drop-shadow(0 4px 10px rgba(57, 67, 64, 0.06));
  }

  .stage {
    position: relative;
    width: 320px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto 0;
  }

  .glow-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124, 191, 166, 0.3) 0%, transparent 70%);
    transform: scale(0.8);
    opacity: 0.5;
    transition: transform 0.1s linear, opacity 0.1s linear;
  }

  .progress-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .progress-bg {
    fill: none;
    stroke: rgba(57, 67, 64, 0.06);
    stroke-width: 4;
  }

  .progress-bar {
    fill: none;
    stroke: var(--brand-teal);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-dasharray: 942;
    stroke-dashoffset: 942;
  }

  /* دقیقاً همان کاراکتر SVG شما */
  .character-svg {
    width: 250px;
    height: 250px;
    z-index: 2;
    overflow: visible;
    filter: drop-shadow(0 10px 20px rgba(46, 93, 75, 0.1));
  }

  .status-panel {
    text-align: center;
    z-index: 2;
    margin-bottom: 10px;
  }

  .guide-phase {
    font-size: 22px;
    font-weight: 800;
    height: 32px;
    color: #2e5d4b;
    transition: opacity 0.3s ease;
  }

  .counter-num {
    font-size: 14px;
    font-weight: 600;
    color: var(--brand-teal);
    height: 20px;
    margin-top: 4px;
  }

  .controls {
    width: 100%;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(48, 61, 57, 0.05);
    z-index: 2;
  }

  .modes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .mode-btn {
    background: rgba(255, 255, 255, 0.65);
    border: 1px solid rgba(57, 67, 64, 0.08);
    border-radius: 16px;
    padding: 10px 6px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: center;
    color: #2e5d4b;
  }

  .mode-btn:hover {
    background: #ffffff;
    transform: translateY(-2px);
  }

  .mode-btn.active {
    background: #2e5d4b;
    color: #ffffff;
    border-color: #2e5d4b;
  }

  .mode-btn .title {
    display: block;
    font-size: 12px;
    font-weight: 700;
  }

  .mode-btn .rhythm {
    display: block;
    font-size: 9px;
    opacity: 0.75;
    margin-top: 2px;
  }

  .action-btn {
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    border-radius: 16px;
    border: none;
    background: #2e5d4b;
    color: white;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .action-btn:hover {
    background: #24493b;
  }

  .action-btn.stop {
    background: #d9534f;
  }
</style>
</head>
<body>

<audio id="inhaleSound" src="https://raw.githubusercontent.com/lesehawio/toe/main/A/inhale.wav" preload="auto"></audio>
<audio id="exhaleSound" src="https://raw.githubusercontent.com/lesehawio/toe/main/A/exhale.wav" preload="auto"></audio>

<div class="app-container">
  <!-- هدر جدید با لوگوی معبد احساسات -->
  <header class="header">
    <svg class="header-logo-svg" viewBox="0 0 300 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- نقطه بالای محراب -->
      <circle cx="150" cy="35" r="11" fill="#343b3a"/>
      <!-- طاق خارجی -->
      <path d="M 100 210 V 160 C 100 100, 200 100, 200 160 V 210" stroke="#343b3a" stroke-width="10" stroke-linecap="round"/>
      <!-- طاق داخلی همراه با فیلینگ ملایم -->
      <path d="M 124 210 V 165 C 124 125, 176 125, 176 165 V 210 Z" fill="#f0f3f2" stroke="#687572" stroke-width="7" stroke-linecap="round"/>
      <!-- موج فوقانی -->
      <path d="M 60 178 Q 120 178 150 193 T 240 178" stroke="#687572" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- موج تحتانی -->
      <path d="M 50 225 Q 110 210 150 228 T 250 225" stroke="#52615d" stroke-width="7" fill="none" stroke-linecap="round"/>
    </svg>
  </header>

  <div class="stage">
    <div class="glow-ring" id="glowRing"></div>
    <svg class="progress-svg" viewBox="0 0 320 320">
      <circle class="progress-bg" cx="160" cy="160" r="150"/>
      <circle class="progress-bar" id="progressBar" cx="160" cy="160" r="150"/>
    </svg>

    <!-- کاراکتر دقیق شما -->
    <svg class="character-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <g id="breatheGroup" style="transform-origin: 250px 250px;">
        <circle cx="250" cy="260" r="180" fill="#7CBFA6" />
        <circle cx="250" cy="250" r="180" fill="#A3D9C3" />
        <g stroke="#2F4F4F" stroke-width="10" stroke-linecap="round" fill="none">
          <path d="M 190 180 Q 210 200 230 180" />
          <path d="M 270 180 Q 290 200 310 180" />
          <path id="smilePath" d="M 180 225 Q 250 275 320 225" style="transform-origin: 250px 235px;" />
        </g>
      </g>
    </svg>
  </div>

  <div class="status-panel">
    <div class="guide-phase" id="guidePhase">آماده‌ای؟</div>
    <div class="counter-num" id="counterNum">تمرین مورد نظر را انتخاب کنید</div>
  </div>

  <div class="controls">
    <div class="modes-grid">
      <button class="mode-btn" onclick="selectMode('box', this)">
        <span class="title">تنفس جعبه‌ای</span>
        <span class="rhythm">۴-۴-۴-۴</span>
      </button>
      <button class="mode-btn" onclick="selectMode('relax', this)">
        <span class="title">آرامش‌بخش</span>
        <span class="rhythm">۴-۷-۸</span>
      </button>
      <button class="mode-btn" onclick="selectMode('deep', this)">
        <span class="title">تنفس عمیق</span>
        <span class="rhythm">۵-۰-۵-۰</span>
      </button>
    </div>
    <button class="action-btn" id="actionBtn" onclick="togglePractice()">شروع تمرین</button>
  </div>
</div>

<script>
  const inhaleAudio = document.getElementById('inhaleSound');
  const exhaleAudio = document.getElementById('exhaleSound');

  // تنظیم سرعت صداها
  inhaleAudio.playbackRate = 0.5;  // دم با سرعت 0.5x
  exhaleAudio.playbackRate = 0.75; // بازدم با سرعت 0.75x

  const guidePhase = document.getElementById('guidePhase');
  const counterNum = document.getElementById('counterNum');
  const progressBar = document.getElementById('progressBar');
  const breatheGroup = document.getElementById('breatheGroup');
  const smilePath = document.getElementById('smilePath');
  const glowRing = document.getElementById('glowRing');
  const actionBtn = document.getElementById('actionBtn');

  const CIRCUMFERENCE = 2 * Math.PI * 150;

  const RHYTHMS = {
    box: [
      { name: 'با دماغت نفس بکش', duration: 4000, type: 'inhale' },
      { name: 'نفس رو نگه دار', duration: 4000, type: 'hold' },
      { name: 'آروم بازدم کن', duration: 4000, type: 'exhale' },
      { name: 'دوباره نگه دار', duration: 4000, type: 'hold' }
    ],
    relax: [
      { name: 'با دماغت نفس بکش', duration: 4000, type: 'inhale' },
      { name: 'نفس رو نگه دار... آرام باش', duration: 7000, type: 'hold' },
      { name: 'خیلی آروم بازدم کن', duration: 8000, type: 'exhale' }
    ],
    deep: [
      { name: 'نفس عمیق بکش', duration: 5000, type: 'inhale' },
      { name: 'آروم بازدم کن... همه چیز خوبه', duration: 5000, type: 'exhale' }
    ]
  };

  let selectedModeKey = 'box';
  let isRunning = false;
  let animationFrameId = null;

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function selectMode(key, btnEl) {
    if (isRunning) stopPractice();
    selectedModeKey = key;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
  }

  function togglePractice() {
    if (isRunning) {
      stopPractice();
    } else {
      startPractice();
    }
  }

  function startPractice() {
    isRunning = true;
    actionBtn.textContent = 'پایان تمرین';
    actionBtn.classList.add('stop');
    runSequence(0);
  }

  function stopPractice() {
    isRunning = false;
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    actionBtn.textContent = 'شروع تمرین';
    actionBtn.classList.remove('stop');
    
    guidePhase.textContent = 'آماده‌ای؟';
    counterNum.textContent = 'تمرین را شروع کنید';
    progressBar.style.strokeDashoffset = CIRCUMFERENCE;
    breatheGroup.style.transform = 'scale(1)';
    smilePath.style.transform = 'scaleX(1)';
    glowRing.style.transform = 'scale(0.8)';
    glowRing.style.opacity = '0.5';

    inhaleAudio.pause(); inhaleAudio.currentTime = 0;
    exhaleAudio.pause(); exhaleAudio.currentTime = 0;
  }

  function runSequence(stepIndex) {
    if (!isRunning) return;

    const sequence = RHYTHMS[selectedModeKey];
    const currentStep = sequence[stepIndex % sequence.length];
    const startTime = performance.now();

    guidePhase.textContent = currentStep.name;

    if (currentStep.type === 'inhale') {
      try { inhaleAudio.currentTime = 0; inhaleAudio.play(); } catch(e){}
    } else if (currentStep.type === 'exhale') {
      try { exhaleAudio.currentTime = 0; exhaleAudio.play(); } catch(e){}
    }

    function animate(currentTime) {
      if (!isRunning) return;

      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / currentStep.duration, 1);
      const easedProgress = easeInOutCubic(progress);

      progressBar.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

      const remainingSec = Math.ceil((currentStep.duration - elapsed) / 1000);
      counterNum.textContent = remainingSec > 0 ? remainingSec + ' ثانیه' : '';

      if (currentStep.type === 'inhale') {
        const scale = 1 + (0.12 * easedProgress);
        breatheGroup.style.transform = `scale(${scale})`;
        smilePath.style.transform = `scaleX(${1 + (0.3 * easedProgress)})`;
        glowRing.style.transform = `scale(${0.8 + (0.4 * easedProgress)})`;
        glowRing.style.opacity = `${0.4 + (0.5 * easedProgress)}`;
      } else if (currentStep.type === 'exhale') {
        const scale = 1.12 - (0.12 * easedProgress);
        breatheGroup.style.transform = `scale(${scale})`;
        smilePath.style.transform = `scaleX(${1.3 - (0.3 * easedProgress)})`;
        glowRing.style.transform = `scale(${1.2 - (0.4 * easedProgress)})`;
        glowRing.style.opacity = `${0.9 - (0.5 * easedProgress)}`;
      }

      if (progress < 1) {
        animationFrameId = requestAnimationFrame(animate);
      } else {
        runSequence(stepIndex + 1);
      }
    }

    animationFrameId = requestAnimationFrame(animate);
  }

  document.querySelector('.mode-btn').classList.add('active');
</script>
</body>
</html>
