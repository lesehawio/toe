<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<title>معبد شادی | Temple of Joy</title>
<link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/lesehawio/toe/main/ect/%D9%84%D9%88%DA%AF%D9%88.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');

  :root{
    --bg-start:#fffdf5; --bg-end:#fff4cc;
    --text-main:#3a2e00; --text-muted:#8c7b4a;
    --joy-primary:#f6c90e; --joy-primary-dark:#d4a400;
    --card-bg:rgba(255,255,255,.78);
    --card-border:rgba(255,255,255,.9);
    --shadow:0 10px 30px rgba(212,164,0,.1);
    --radius-lg:28px;
    --font:'Vazirmatn',Tahoma,sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--bg-start)}
  body{
    direction:rtl; font-family:var(--font);
    background:radial-gradient(circle at 50% 0%,#fff 0%,var(--bg-start) 40%,var(--bg-end) 100%);
    color:var(--text-main); max-width:640px; margin:auto;
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
    min-height:100vh; position:relative; overflow-x:hidden;
    -webkit-font-smoothing:antialiased; line-height:1.9;
  }

  /* ===== امواج ===== */
  .ambient-waves{position:fixed;bottom:0;left:0;width:100%;height:280px;z-index:0;pointer-events:none;overflow:hidden}
  .ambient-waves svg{width:100%;height:100%;display:block}
  .wave-group{transform-box:fill-box;transform-origin:center bottom}
  .wave-path{transform-box:fill-box;transform-origin:center bottom}
  .wave-group-1{animation:flowX1 22s ease-in-out infinite alternate}
  .wave-group-2{animation:flowX2 28s ease-in-out infinite alternate}
  .wave-group-3{animation:flowX3 34s ease-in-out infinite alternate}
  @keyframes flowX1{0%{transform:translateX(-3%) rotate(.5deg)}100%{transform:translateX(3%) rotate(-1deg)}}
  @keyframes flowX2{0%{transform:translateX(3%) rotate(-1deg)}100%{transform:translateX(-3%) rotate(1deg)}}
  @keyframes flowX3{0%{transform:translateX(-2%) rotate(.8deg)}100%{transform:translateX(4%) rotate(-.5deg)}}
  .wave-path-1{animation:breatheY1 14s ease-in-out infinite}
  .wave-path-2{animation:breatheY2 18s ease-in-out infinite 2s}
  .wave-path-3{animation:breatheY3 22s ease-in-out infinite 4s}
  @keyframes breatheY1{0%,100%{transform:translateY(0) scaleY(1);opacity:.5}50%{transform:translateY(-14px) scaleY(1.08);opacity:.85}}
  @keyframes breatheY2{0%,100%{transform:translateY(0) scaleY(1);opacity:.4}50%{transform:translateY(-20px) scaleY(1.12);opacity:.75}}
  @keyframes breatheY3{0%,100%{transform:translateY(0) scaleY(1);opacity:.3}50%{transform:translateY(-10px) scaleY(1.05);opacity:.6}}

  /* ===== هدر ===== */
  .header-section{text-align:center;margin-bottom:25px;position:relative;z-index:2;animation:fadeInDown .8s ease both}
  .joy-logo-container{position:relative;display:inline-block;margin-bottom:15px}
  .joy-logo-container::before{
    content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:160px;height:160px;background:radial-gradient(circle,rgba(246,201,14,.3) 0%,transparent 70%);
    border-radius:50%;z-index:-1;animation:pulseGlow 4s ease-in-out infinite;
  }
  .joy-logo-frame{
    width:120px;height:120px;border-radius:50%;background:#fff;
    border:3px solid rgba(255,255,255,.9);
    box-shadow:0 10px 30px rgba(212,164,0,.15),inset 0 0 20px rgba(246,201,14,.1);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    position:relative;animation:float 4s ease-in-out infinite;
  }
  .joy-logo-frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
  .joy-logo-frame:hover img{transform:scale(1.08)}
  h1{color:#b08d00;font-size:24px;font-weight:800;margin:0;letter-spacing:-.5px}
  .subtitle{font-size:12px;color:var(--text-muted);margin-top:5px;font-weight:500;letter-spacing:1px}

  /* ===== دکمه بازگشت ===== */
  .back-home{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    color:var(--text-muted);font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:50px;
    background:rgba(255,255,255,.6);border:1px solid var(--card-border);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    margin-bottom:15px;position:relative;z-index:2;transition:all .3s ease;
  }
  .back-home:hover{background:#fff;color:var(--text-main);box-shadow:0 4px 15px rgba(0,0,0,.05);transform:translateX(5px)}
  .back-home svg{width:16px;height:16px}

  /* ===== کارت سوال ===== */
  .question-card{
    background:var(--card-bg);border:1px solid var(--card-border);
    border-radius:var(--radius-lg);padding:35px 25px;
    box-shadow:var(--shadow),inset 0 2px 10px rgba(255,255,255,.5);
    margin-bottom:25px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
    position:relative;z-index:2;overflow:hidden;animation:fadeInUp .6s ease both;
  }
  .question-card::before{
    content:"";position:absolute;top:-60px;left:-40px;
    width:180px;height:180px;background:radial-gradient(circle,rgba(246,201,14,.15) 0%,transparent 70%);
    border-radius:50%;z-index:0;
  }
  .question-icon{display:flex;justify-content:center;margin-bottom:15px;position:relative;z-index:1}
  .question-icon svg{width:32px;height:32px;color:var(--joy-primary-dark);filter:drop-shadow(0 4px 8px rgba(246,201,14,.3))}
  #question{
    font-size:19px;font-weight:700;line-height:1.8;margin:0;
    position:relative;z-index:1;text-align:center;min-height:70px;
    display:flex;align-items:center;justify-content:center;
  }

  /* ===== دکمه‌ها ===== */
  .buttons-container{display:flex;justify-content:center;gap:15px;position:relative;z-index:2;animation:fadeInUp .6s ease .1s both}
  button{
    font-family:var(--font);font-size:16px;font-weight:700;
    padding:14px 40px;border-radius:50px;border:none;cursor:pointer;
    transition:all .3s cubic-bezier(.25,.8,.25,1);
    box-shadow:0 4px 15px rgba(0,0,0,.05);position:relative;overflow:hidden;
  }
  #yesBtn{background:linear-gradient(135deg,#ffd633,#f6c90e 50%,#e0b700);color:#4a3b00;box-shadow:0 8px 25px rgba(246,201,14,.4)}
  #yesBtn::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transition:.5s}
  #yesBtn:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(246,201,14,.5)}
  #yesBtn:hover::after{left:100%}
  #noBtn{background:rgba(255,255,255,.7);color:var(--text-muted);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  #noBtn:hover{background:#fff;color:var(--text-main);transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.06)}
  button:active{transform:translateY(0) scale(.96)}

  /* ===== کارت نتیجه (راهکار + معجون با هم) ===== */
  #result{
    background:linear-gradient(145deg,#fffbe6,#fff4cc);
    border:1px solid rgba(246,201,14,.3);padding:25px;margin-top:25px;
    border-radius:var(--radius-lg);display:none;line-height:2;
    font-size:15px;font-weight:500;color:#5c4a00;
    box-shadow:0 10px 30px rgba(212,164,0,.08),inset 0 2px 10px rgba(255,255,255,.5);
    position:relative;z-index:2;text-align:right;
  }
  .result-header{
    display:flex;align-items:center;gap:10px;margin-bottom:15px;
    padding-bottom:12px;border-bottom:1px dashed rgba(212,164,0,.3);
    font-weight:700;font-size:16px;color:#b08d00;
  }
  .result-header svg{width:24px;height:24px;color:var(--joy-primary-dark);flex-shrink:0}
  #resultText{white-space:pre-wrap;margin-bottom:20px}

  /* ===== کارت معجون داخل نتیجه ===== */
  .potion-inner{
    background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);
    border-radius:22px;padding:20px;margin-top:10px;
    text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 6px 20px rgba(212,164,0,.08);
    animation:fadeInUp .5s ease both;
  }
  .potion-inner .potion-svg{width:140px;height:140px;margin:0 auto 12px;display:block;overflow:visible}
  .potion-title{font-size:20px;font-weight:800;color:#b08d00;margin:0 0 6px}
  .potion-desc{font-size:13px;color:var(--text-muted);line-height:1.9;margin:0 0 16px}

  /* ===== محتوای کامل معجون ===== */
  .potion-content{
    text-align:right;margin-top:18px;padding-top:16px;
    border-top:1px dashed rgba(212,164,0,.3);
  }
  .potion-content h3{
    font-size:15px;font-weight:800;color:#a27e00;margin:18px 0 8px;
  }
  .potion-content h3:first-child{margin-top:0}
  .potion-content p{font-size:14px;color:#5a4700;margin:0 0 12px;line-height:1.95}
  .potion-content ul,.potion-content ol{padding-right:20px;margin:0 0 14px;font-size:14px;color:#5a4700}
  .potion-content li{margin-bottom:7px;line-height:1.85}
  .potion-content blockquote{
    background:rgba(255,245,184,.6);border-right:4px solid #e6c75a;
    border-radius:6px;padding:10px 14px;margin:14px 0;
    font-style:italic;color:#8c7c00;font-size:14px;
  }
  .potion-content .highlight{
    background:rgba(255,245,184,.7);padding:12px 16px;
    border-right:4px solid #e6c75a;border-radius:8px;margin:14px 0;
    font-size:14px;line-height:1.95;
  }

  /* ===== دکمه‌های پایانی ===== */
  .result-actions{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:18px}
  .result-actions button{
    font-size:14px;padding:12px 32px;width:100%;max-width:280px;
  }
  #continueBtn{background:linear-gradient(135deg,#ffd633,#f6c90e 50%,#e0b700);color:#4a3b00;box-shadow:0 8px 25px rgba(246,201,14,.4)}
  #continueBtn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(246,201,14,.5)}
  .restart-btn{background:#fff;color:#b08d00;border:1px solid rgba(246,201,14,.3);box-shadow:0 4px 15px rgba(212,164,0,.15)}
  .restart-btn:hover{background:#fffdf5;transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,164,0,.2)}

  /* ===== پیام نهایی ===== */
  #final{
    background:linear-gradient(135deg,#f0fdf4,#dcfce7);color:#166534;
    padding:30px 25px;margin-top:25px;border:2px dashed #86efac;
    border-radius:var(--radius-lg);font-size:16px;font-weight:600;line-height:2;
    display:none;text-align:center;position:relative;z-index:2;
    box-shadow:0 10px 30px rgba(22,101,52,.08);white-space:pre-wrap;
  }

  /* ===== انیمیشن SVG ===== */
  .bottle{transform-box:fill-box;transform-origin:center;animation:float 4s ease-in-out infinite}
  .liquid{animation:liquid 3.5s ease-in-out infinite alternate}
  .bubble{animation:bubble 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .b2{animation-delay:1s}
  .b3{animation-delay:1.8s}
  .glow{animation:glow 4s ease-in-out infinite}

  @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-11px) rotate(1deg)}}
  @keyframes liquid{from{transform:translateY(3px)}to{transform:translateY(-4px)}}
  @keyframes bubble{0%,100%{transform:translateY(5px);opacity:.35}50%{transform:translateY(-12px);opacity:1}}
  @keyframes glow{0%,100%{opacity:.25}50%{opacity:.55}}
  @keyframes pulseGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.8}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}}
  @keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  @media (min-width:601px){
    #question{font-size:21px}
    .joy-logo-frame{width:140px;height:140px}
    h1{font-size:28px}
    .potion-inner .potion-svg{width:180px;height:180px}
    .potion-title{font-size:24px}
  }
  @media (max-width:400px){
    #question{font-size:17px}
    .joy-logo-frame{width:100px;height:100px}
    button{padding:12px 30px;font-size:15px}
    h1{font-size:22px}
    .question-card{padding:25px 20px}
    .potion-inner .potion-svg{width:120px;height:120px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    .ambient-waves{display:none}
  }
</style>
</head>
<body>

<!-- امواج -->
<div class="ambient-waves" aria-hidden="true">
  <svg viewBox="0 0 600 210" preserveAspectRatio="none">
    <g class="wave-group wave-group-3"><path class="wave-path wave-path-3" d="M-50 145 C130 95 200 195 330 135 S520 90 650 150 L650 220 L-50 220Z" fill="#fbbf24"/></g>
    <g class="wave-group wave-group-2"><path class="wave-path wave-path-2" d="M-50 105 C110 45 180 165 300 100 S500 45 650 112 L650 220 L-50 220Z" fill="#fcd34d"/></g>
    <g class="wave-group wave-group-1"><path class="wave-path wave-path-1" d="M-50 65 C100 5 160 135 270 70 S470 5 650 78 L650 220 L-50 220Z" fill="#fde68a"/></g>
  </svg>
</div>

<!-- بازگشت -->
<a href="index.html" class="back-home">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  بازگشت به معبد
</a>

<!-- هدر -->
<div class="header-section">
  <div class="joy-logo-container">
    <div class="joy-logo-frame">
      <img src="https://raw.githubusercontent.com/lesehawio/toe/main/ect/%D8%B4%D8%A7%D8%AF%DB%8C.svg" alt="لوگوی شادی">
    </div>
  </div>
  <h1>معبد شادی</h1>
  <p class="subtitle">A QUIET SPACE WITHIN</p>
</div>

<!-- سوال -->
<div class="question-card" id="questionCard">
  <div class="question-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </div>
  <div id="question"></div>
</div>

<!-- دکمه‌ها -->
<div class="buttons-container" id="buttonsContainer">
  <button id="yesBtn">بله</button>
  <button id="noBtn">خیر</button>
</div>

<!-- نتیجه: راهکار + معجون با هم -->
<div id="result">
  <div class="result-header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/>
    </svg>
    راهکار پیشنهادی
  </div>
  <div id="resultText"></div>
  <div id="potionMount"></div>
  <div class="result-actions">
    <button id="continueBtn">ادامه</button>
    <button class="restart-btn" id="restartBtn">شروع دوباره</button>
  </div>
</div>

<!-- پیام نهایی -->
<div id="final"></div>

<script>
  /* ============================================================
     داده‌های کامل ۱۰ معجون (محتوای فایل‌های HTML)
     ============================================================ */
  const potions = {
    sweetBody: {
      title:"شیرینی جسم",
      desc:"لذت بردن از بدن، حس‌های بدنی، تماس، طعم، حرکت و حیات بدنی به‌گونه‌ای که به تو انرژی و شادی بده.",
      colors:{light:"#ffe082",mid:"#ffb300",dark:"#e65100"},
      content:`
        <h3>چی هست؟</h3>
        <p>«شیرینی جسم» یعنی لذت بردن از بدن، حس‌های بدنی، تماس، طعم، حرکت و حیات بدنی به‌گونه‌ای که به تو انرژی و شادی بده. این معجون دقیقاً نقطه‌ی اتصال جسم و روانه — وقتی بدن احساس لذت، سبکی، رضایت و امنیت می‌کنه، ذهن هم ناخودآگاه شادی تولید می‌کنه.</p>
        <h3>چه زمانی به کارت میاد؟</h3>
        <ul><li>وقتی احساس بی‌روحی یا بی‌حسی می‌کنی</li><li>وقتی مغزت قفل کرده و هیچ‌چیزی شادت نمی‌کنه</li><li>وقتی شادی روانی نداری، اما بدنت نیاز به نوازش یا حرکت داره</li><li>وقتی تنش، بی‌حوصلگی یا دل‌مردگی داری</li></ul>
        <h3>مواد تشکیل‌دهنده</h3>
        <ul><li><strong>لمس آگاهانه:</strong> دست کشیدن به پوست، نوازش بازو، دست یا صورت، شانه‌ها، یا حتی یک آغوش با خودت.</li><li><strong>حرکت موزون بدن:</strong> یک رقص آزاد، حتی درجا — لازم نیست کامل بلد باشی.</li><li><strong>طعم ملایم و شاد:</strong> یک قاشق عسل طبیعی، یا کمی میوه‌ی شیرین مثل انگور یا خرما. ولی کم!</li><li><strong>آب‌نوشی لذت‌بخش:</strong> آب خنک با لیمو یا گلاب یا دمنوش معطر — آهسته خوردن، مزه‌کردن.</li><li><strong>حرکات کششی عمیق:</strong> باز کردن دست‌ها، چرخاندن شانه‌ها، کشیدن عضلات پا و کمر</li><li><strong>نور آفتاب روی پوست:</strong> چند دقیقه ایستادن یا نشستن در نور طبیعی آفتاب.</li></ul>
        <h3>چرا جواب می‌ده؟</h3>
        <p>وقتی به بدن توجه می‌کنی، سیگنال‌های آرامش و شادی به مغز فرستاده می‌شن. لمس، طعم شیرین، حرکت و نور همه روی هورمون‌هایی مثل دوپامین، اکسی‌توسین، سروتونین و اندورفین تأثیر می‌ذارن — همون ترکیبی که شادی طبیعی می‌سازه.</p>
        <div class="highlight">تمرین ۵ دقیقه‌ای سریع:<br>یک آهنگ آروم بذار یا به سکوت گوش بده<br>یک لیوان آب یا چیزی شیرین و ملایم بخور<br>دستاتو روی بازوهات بکش<br>چند حرکت کششی انجام بده<br>چشماتو ببند و لبخند کوچیک بزن<br>بگو: "بدنم امنه، زندمه، دوست‌داشتنیه."</div>
      `
    },
    sunSoul: {
      title:"آفتابک جان",
      desc:"آن بخشی از وجودت که همیشه دنبال نور، گرما، امید و روشنیه.",
      colors:{light:"#fff59d",mid:"#ffd54f",dark:"#ff8f00"},
      content:`
        <h3>آفتابک جان یعنی چی؟</h3>
        <p>«آفتابک جان» استعاره‌ای است از آن بخشی از وجودت که همیشه دنبال نور، گرما، امید و روشنیه. اون بخشی که وقتی غم داری، یک پرده رو کنار می‌زنه، یک جمله‌ی روشن میگه، یا حتی فقط نفس عمیق می‌کشه و می‌گه: <strong>«من هنوز زنده‌ام.»</strong></p>

        <ul><li>افزایش حس آرامش و امنیت</li><li>کاهش استرس و اضطراب</li><li>تقویت تمرکز و خلاقیت</li><li>ایجاد حس تجدید انرژی و شفا</li></ul>
        <h3>در معبد احساسات</h3>
        <p>«نقاشی نور» یک سفر خیالی به درون است، یک بازی با رنگ‌ها و نورها که به تو یادآوری می‌کند تو قدرت خلق آرامش و زیبایی در دنیای درونت را داری.</p>
      `
    },
    joyRecord: {
      title:"پخش زنده‌ی خوشی",
      desc:"جشن بزرگ و روشن درون قلبت، که هر لحظه از خوشحالی تو را پخش می‌کند.",
      colors:{light:"#fff176",mid:"#ffd600",dark:"#ff6f00"},
      content:`
        <p>تصور کن که یک جشن بزرگ و روشن درون قلبت برپا شده، جایی که هر لحظه از خوشحالی تو، مثل یک موج نوری در فضا پخش می‌شود و اطراف را پر از شادی و گرما می‌کند.</p>
        <h3>چرا «پخش زنده‌ی خوشی»؟</h3>
        <ul><li>شادی تو فقط یک حس نیست، یک انرژی زنده است که می‌تواند در لحظه جاری شود و تو را به اوج ببرد.</li><li>وقتی خوشی را «پخش» می‌کنی، مثل یک موج مثبت، خودت و اطرافیانت را به حرکت درمی‌آوری.</li></ul>
        <h3>چگونه «پخش زنده‌ی خوشی» را انجام دهیم؟</h3>
        <ol><li>چشم‌هایت را ببند و نفس عمیق بکش</li><li>یک خاطره‌ی شاد یا چیزی که الان باعث لبخندت می‌شود را به یاد بیاور</li><li>تصور کن این خوشی مثل نور زرد و گرم، از قلبت شروع به تابیدن می‌کند</li><li>با هر نفس، این نور و حس خوشی را به تمام بدن و اطرافت پخش کن</li><li>می‌توانی این شادی را با صداهای خوش (مثل خنده یا آواز آرام) همراه کنی</li><li>خودت را در وسط این جشن زنده ببین، که همه چیز رنگ و نور شادی گرفته</li></ol>
        <h3>تأثیرات «پخش زنده‌ی خوشی»</h3>
        <ul><li>افزایش سریع حس شادی و انرژی مثبت</li><li>تقویت روحیه و انگیزه</li><li>کاهش استرس و فشارهای روانی</li><li>ایجاد ارتباط مثبت با خود و دیگران</li></ul>
        <h3>در معبد احساسات</h3>
        <p>«پخش زنده‌ی خوشی» یک راه ساده و موثر است برای جاری کردن شادی در زندگی‌ات، و یادآوری این که شادی تو، انرژی بی‌پایانی است که همیشه درون تو جاری است و می‌تواند در هر لحظه آزاد شود.</p>
      `
    },
    randomGift: {
      title:"جایزه‌ی بی‌دلیل",
      desc:"وقتی بی‌دلیل خودت را خوشحال می‌کنی، یک دلیل تازه برای زندگی می‌سازی.",
      colors:{light:"#ffecb3",mid:"#ffca28",dark:"#ff6f00"},
      content:`
        <p>وقتی بی‌دلیل خودت را خوشحال می‌کنی، یک دلیل تازه برای زندگی می‌سازی.</p>
        <h3>چی هست «جایزه‌ی بی‌دلیل»؟</h3>
        <p>گاهی لازم نیست کار خاصی کرده باشی تا «مستحق» یک جایزه باشی.<br>کافیه فقط "بودن"‌ت رو جشن بگیری.<br>این معجون یعنی با یک چیز کوچیک، خودت رو بی‌بهانه خوشحال کنی:</p>
        <ul><li>یک شکلات</li><li>یک آهنگ موردعلاقه</li><li>یک استراحت وسط روز</li><li>یا حتی گفتن «آفرین» به خودت</li></ul>
        <h3>چرا مهمه؟</h3>
        <ul><li>مغز تو به جایزه واکنش می‌ده، حتی اگه دلیل خاصی نباشه</li><li>این کار باعث ترشح دوپامین و سروتونین می‌شه</li><li>یاد می‌گیری خودت منبع خوشحال کردن خودت باشی، نه دیگران یا شرایط بیرونی</li></ul>
        <h3>چطور اجراش کنم؟</h3>
        <ol><li>یک جایزه‌ی کوچیک و لذت‌بخش انتخاب کن (خوراکی، صدا، لمس، حرکت، نور...)</li><li>قبل از استفاده، با لبخند بگو: "این هدیه مالِ منه، چون... چون من هستم."</li><li>با تمام توجه، لذت ببر از اون هدیه. نه با عجله، نه با فکرای دیگه</li><li>اگه شد، بنویس: این لحظه‌ی پاداش، چطور حس منو تغییر داد؟</li></ol>
        <h3>نمونه‌های «جایزه‌ی بی‌دلیل»</h3>
        <ul><li>خریدن یک برچسب بامزه و چسبوندنش به دفترت</li><li>گوش دادن به آهنگی که تو رو می‌بره به جای خوب</li><li>پاشیدن عطر مورد علاقه‌ت، فقط برای خودت</li><li>گرفتن یک عکس از خودت که فقط برای خودت باشه</li><li>گفتن جمله‌هایی مثل: «من ارزش دارم، حتی اگه امروز کاری نکردم»</li></ul>
        <h3>در معبد احساسات</h3>
        <p>«جایزه‌ی بی‌دلیل» ستون کوچیکی از شکوه شادیه<br>که بهت یادآوری می‌کنه:<br><strong>بودنِ تو، خودش یک موفقیته.</strong></p>
      `
    }
  };

  /* ============================================================
     الگوریتم
     ============================================================ */
  const steps = [
    {
      text:"آیا بدنم حس سبکی، گرما یا حرکت داره؟",
      yes:1,
      no:{
        message:"بدن نیاز به بیدار شدن داره:\n• یک لیوان آب بخور\n• بازوهات رو بغل کن یا دست‌هات رو به هم بمال\n• ۵ دقیقه راه برو یا کشش سبک انجام بده\n• اگه خسته‌ای فقط ۳ نفس عمیق بکش",
        next:1,
        potion:"sweetBody"
      }
    },
    {
      text:"آیا با کسی در تعامل عاطفی یا معنایی بوده‌ام؟",
      yes:2,
      no:{
        message:"قلبت نیاز به پیوند داره:\n• به کسی پیام صوتی بده و از حالت بگو\n• اگه کسی نیست، یادداشتی بنویس مثل نامه به یک دوست\n• یا صدای خودت رو ضبط کن و حرف دلت رو بزن",
        next:2,
        potion:"touchKiss"
      }
    },
    {
      text:"آیا الان حس رهایی، معنا یا پیوند دارم؟",
      yes:"done",
      no:{
        message:"ذهنت نیاز به نور داره:\n• به یک چیز کوچیک و معنادار نگاه کن (عکس بچگی، آسمون، یک جمله)\n• یک هدف ۵ دقیقه‌ای تعریف کن (مثلاً مرتب کردن میز)\n• یک موسیقی یا تصویر الهام‌بخش پخش کن",
        next:"done",
        potion:"goldenChant"
      }
    }
  ];

  const finalMessage = "تو الان شادی اصیل رو داری، حتی اگه کوچیک باشه :)\n\nثبتش کن (با نوشتن، نقاشی، عکس گرفتن، نفس عمیق)\nمی‌تونی اینو با یکی شریک بشی، یا فقط توی دل خودت نگه داریش و لبخند بزنی :)";

  let currentStep = 0;
  let nextStep = null;
  let finalPotion = null;

  const questionEl = document.getElementById("question");
  const questionCard = document.getElementById("questionCard");
  const resultEl = document.getElementById("result");
  const resultTextEl = document.getElementById("resultText");
  const potionMount = document.getElementById("potionMount");
  const finalEl = document.getElementById("final");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const continueBtn = document.getElementById("continueBtn");
  const restartBtn = document.getElementById("restartBtn");
  const buttonsContainer = document.getElementById("buttonsContainer");

  /* ===== SVG بطری ===== */
  function potionSVG(colors){
    return `
      <svg class="potion-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="glass-${colors.mid}" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#ffffff" stop-opacity=".4"/>
            <stop offset=".35" stop-color="#b9e8e6" stop-opacity=".08"/>
            <stop offset=".7" stop-color="#ffffff" stop-opacity=".02"/>
            <stop offset="1" stop-color="#9bd8dc" stop-opacity=".35"/>
          </linearGradient>
          <linearGradient id="potion-${colors.mid}" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="${colors.light}"/>
            <stop offset=".45" stop-color="${colors.mid}"/>
            <stop offset="1" stop-color="${colors.dark}"/>
          </linearGradient>
          <linearGradient id="cork-${colors.mid}" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#80502f"/><stop offset=".5" stop-color="#d5a16b"/><stop offset="1" stop-color="#88512d"/>
          </linearGradient>
          <clipPath id="inside-${colors.mid}">
            <path d="M165 127 L235 127 L235 151 Q235 165 253 182 Q276 205 276 230 L276 302 Q276 319 258 319 L142 319 Q124 319 124 302 L124 230 Q124 205 147 182 Q165 165 165 151Z"/>
          </clipPath>
          <filter id="blur-${colors.mid}"><feGaussianBlur stdDeviation="15"/></filter>
        </defs>

        <g class="glow"><ellipse cx="200" cy="225" rx="115" ry="130" fill="${colors.mid}" opacity=".35" filter="url(#blur-${colors.mid})"/></g>
        <ellipse cx="200" cy="345" rx="77" ry="12" fill="#000" opacity=".35"/>

        <g class="bottle">
          <g>
            <path d="M170 58 Q170 48 180 48 L220 48 Q230 48 230 58 L225 107 L175 107Z" fill="url(#cork-${colors.mid})" stroke="#6b432e" stroke-width="2"/>
            <path d="M180 53 Q175 65 180 88" fill="none" stroke="#f4c38c" stroke-width="4" opacity=".5"/>
            <path d="M190 52 L190 99" stroke="#71462d" opacity=".25"/>
            <rect x="174" y="100" width="52" height="9" rx="3" fill="#70452f"/>
          </g>
          <g>
            <path d="M166 105 L234 105 L234 151 Q234 165 252 182 L148 182 Q166 165 166 151Z" fill="url(#glass-${colors.mid})" stroke="#c4e7e9" stroke-width="3"/>
          </g>
          <g clip-path="url(#inside-${colors.mid})">
            <rect x="120" y="225" width="160" height="110" fill="url(#potion-${colors.mid})"/>
            <g class="liquid">
              <path d="M115 227 Q150 215 180 227 Q220 239 250 223 Q270 216 290 225 L290 340 L110 340Z" fill="${colors.light}" opacity=".75"/>
            </g>
            <g fill="#fff">
              <circle class="bubble" cx="157" cy="270" r="5" opacity=".7"/>
              <circle class="bubble b2" cx="225" cy="285" r="4"/>
              <circle class="bubble b3" cx="190" cy="248" r="3"/>
              <circle class="bubble b2" cx="245" cy="258" r="2.5"/>
              <circle class="bubble b3" cx="170" cy="300" r="2"/>
            </g>
          </g>
          <g>
            <path d="M165 127 L235 127 L235 151 Q235 165 253 182 Q276 205 276 230 L276 302 Q276 322 256 322 L144 322 Q124 322 124 302 L124 230 Q124 205 147 182 Q165 165 165 151Z" fill="url(#glass-${colors.mid})" stroke="#c6e9ed" stroke-width="3.5"/>
            <path d="M140 224 Q140 203 157 185 Q175 167 175 150 L175 137" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".65"/>
            <path d="M260 232 L260 298" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".3"/>
            <path d="M136 307 Q200 317 264 307" fill="none" stroke="#fff" stroke-width="2" opacity=".4"/>
          </g>
          <g>
            <circle cx="200" cy="252" r="25" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>
            <path d="M200 231 L204 246 L219 252 L204 258 L200 273 L196 258 L181 252 L196 246Z" fill="#fff" opacity=".9"/>
          </g>
        </g>

        <g fill="${colors.light}">
          <path class="bubble" d="M105 157 L109 169 L121 173 L109 177 L105 189 L101 177 L89 173 L101 169Z"/>
          <path class="bubble b2" d="M290 130 L293 139 L302 142 L293 145 L290 154 L287 145 L278 142 L287 139Z"/>
          <circle class="bubble b3" cx="290" cy="190" r="3"/>
        </g>
      </svg>
    `;
  }

  /* ===== نمایش سوال ===== */
  function showQuestion(stepIndex){
    currentStep = stepIndex;
    const step = steps[stepIndex];

    questionEl.style.animation = "none";
    void questionEl.offsetHeight;
    questionEl.style.animation = "fadeInUp .5s ease both";
    questionEl.textContent = step.text;

    resultEl.style.display = "none";
    finalEl.style.display = "none";
    potionMount.innerHTML = "";
    questionCard.style.display = "block";
    buttonsContainer.style.display = "flex";
    yesBtn.style.display = "inline-block";
    noBtn.style.display = "inline-block";
  }

  /* ===== نمایش راهکار + معجون با هم ===== */
  function showResult(message, potionKey){
    const p = potions[potionKey];

    resultTextEl.textContent = message;
    potionMount.innerHTML = `
      <div class="potion-inner">
        ${potionSVG(p.colors)}
        <h3 class="potion-title">${p.title}</h3>
        <p class="potion-desc">${p.desc}</p>
        <div class="potion-content">${p.content}</div>
      </div>
    `;

    questionCard.style.display = "none";
    buttonsContainer.style.display = "none";
    resultEl.style.display = "block";
    resultEl.style.animation = "none";
    void resultEl.offsetHeight;
    resultEl.style.animation = "fadeInUp .5s ease both";
    resultEl.scrollIntoView({ behavior:"smooth", block:"start" });
  }

  /* ===== دکمه بله ===== */
  yesBtn.onclick = () => {
    const step = steps[currentStep];
    if(step.yes === "done"){
      questionCard.style.display = "none";
      buttonsContainer.style.display = "none";
      resultEl.style.display = "none";
      finalEl.textContent = finalMessage;
      finalEl.style.display = "block";
      finalEl.style.animation = "none";
      void finalEl.offsetHeight;
      finalEl.style.animation = "fadeInUp .6s ease both";
      finalEl.scrollIntoView({ behavior:"smooth", block:"center" });
    } else {
      showQuestion(step.yes);
    }
  };

  /* ===== دکمه خیر ===== */
  noBtn.onclick = () => {
    const step = steps[currentStep];
    nextStep = step.no.next;
    finalPotion = step.no.potion;
    showResult(step.no.message, step.no.potion);
  };

  /* ===== ادامه ===== */
  continueBtn.onclick = () => {
    if(nextStep === "done"){
      /* پایان مسیر: پیام نهایی */
      questionCard.style.display = "none";
      buttonsContainer.style.display = "none";
      resultEl.style.display = "none";
      finalEl.textContent = finalMessage;
      finalEl.style.display = "block";
      finalEl.style.animation = "none";
      void finalEl.offsetHeight;
      finalEl.style.animation = "fadeInUp .6s ease both";
      finalEl.scrollIntoView({ behavior:"smooth", block:"center" });
    } else if(typeof nextStep === "number"){
      showQuestion(nextStep);
    }
  };

  /* ===== شروع دوباره ===== */
  function resetApp(){
    currentStep = 0;
    nextStep = null;
    finalPotion = null;

    finalEl.style.display = "none";
    resultEl.style.display = "none";
    potionMount.innerHTML = "";
    questionCard.style.display = "block";

    showQuestion(0);
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  restartBtn.onclick = resetApp;

  /* ===== شروع ===== */
  showQuestion(0);
</script>

</body>
</html>
